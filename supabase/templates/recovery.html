<!doctype html>
<html>
  <body style="margin:0;background:#0b0c0f;color:#f3f4f6;font-family:Inter,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0b0c0f;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;border:1px solid rgba(255,255,255,0.12);border-radius:12px;background:#12141a;">
            <tr>
              <td style="padding:28px;">
                <p style="margin:0 0 8px;color:#9ca3af;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;">Dungeon &amp; Database</p>
                <h1 style="margin:0 0 12px;color:#ffffff;font-size:24px;line-height:1.25;">Reset your password</h1>
                <p style="margin:0 0 20px;color:#cfd5df;font-size:15px;line-height:1.6;">We received a request to reset your Dungeon &amp; Database password. Choose a new password with the link below.</p>
                <p style="margin:0 0 24px;">
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block;border-radius:8px;background:#bfdbfe;color:#0b1220;font-weight:700;font-size:14px;text-decoration:none;padding:12px 18px;">Reset password</a>
                </p>
                <p style="margin:0;color:#9ca3af;font-size:13px;line-height:1.6;">If you did not request a password reset, you can ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
